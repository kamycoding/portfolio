name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

# A newer push to the same branch cancels the run that is still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, types, test, build
    # Pinned so the move to a new Ubuntu happens on purpose, not when GitHub changes ubuntu-latest.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # Git hooks are for local commits only.
      HUSKY: 0
    steps:
      # Actions are pinned to commit SHAs, Dependabot keeps them up to date.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      # Installs the pnpm version from `packageManager` in package.json and caches the store.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm check-types
      - run: pnpm test
      - run: pnpm build
