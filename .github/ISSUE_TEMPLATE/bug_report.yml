name: Bug report
description: Something on the site does not work or looks wrong.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Describe the problem. Screenshots help.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the page ...
        2. Click ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and browser
      placeholder: iPhone 15, Safari 18
  - type: dropdown
    id: language
    attributes:
      label: Language
      options: [English, German, Both]
  - type: dropdown
    id: theme
    attributes:
      label: Theme
      options: [Dark, Light, Both]
