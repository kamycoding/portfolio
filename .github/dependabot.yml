version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Minor and patch updates arrive as one PR, majors as separate PRs.
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    # @types/node follows the Node major in .nvmrc; it is raised by hand together with the runtime.
    ignore:
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    # Prefixes keep Dependabot commits valid Conventional Commits.
    commit-message:
      prefix: chore(deps)
      prefix-development: chore(deps-dev)

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: ci
