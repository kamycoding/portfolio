<main>
  <section id="hero" class="hero" aria-labelledby="hero-title">
    <img
      class="hero__background"
      src="/assets/hero/hero-background.webp"
      alt=""
      aria-hidden="true"
      draggable="false"
    />

    <div class="hero__container">
      <nav class="hero-socials" aria-label="Social media links">
        <a
          class="hero-socials__link"
          href="https://www.linkedin.com/in/kamyarzamanfar/"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Open Kamyar Zamanfar’s LinkedIn profile"
        >
          <img
            src="/assets/icons/social/linkedin.svg"
            alt=""
            aria-hidden="true"
            draggable="false"
          />
        </a>

        <a
          class="hero-socials__link"
          href="https://github.com/kamycoding"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Open Kamyar Zamanfar’s GitHub profile"
        >
          <img src="/assets/icons/social/github.svg" alt="" aria-hidden="true" draggable="false" />
        </a>

        <a
          class="hero-socials__link"
          href="mailto:kamyar.zamanfar@gmail.com"
          aria-label="Send an email to Kamyar Zamanfar"
        >
          <img src="/assets/icons/social/email.svg" alt="" aria-hidden="true" draggable="false" />
        </a>
      </nav>

      <div class="hero-composition">
        <p class="hero-greeting">Hello world</p>

        <div class="hero-heading-block">
          <h1 id="hero-title" class="hero-title">
            <span class="hero-title__frontend">Frontend</span>
            <span class="hero-title__developer">DEVELOPER</span>
          </h1>

          <a class="hero-cta" href="#contact">
            <span>Get in Touch</span>
          </a>
        </div>

        <figure class="hero-portrait">
          <img
            class="hero-portrait__image"
            src="/assets/hero/portrait-default.webp"
            alt="Portrait of Kamyar Zamanfar"
            draggable="false"
          />

          <figcaption class="hero-portrait__caption">Kamy :)</figcaption>
        </figure>
      </div>
    </div>
  </section>
</main>
