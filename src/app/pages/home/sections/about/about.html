<section
  id="about"
  class="scroll-mt-20 bg-foreground px-4 py-22 text-canvas lg:min-h-180 lg:px-30 lg:py-36"
  aria-labelledby="about-title"
>
  <div
    class="mx-auto grid w-full max-w-300 grid-cols-1 items-center gap-10 lg:grid-cols-2 lg:gap-20"
  >
    <div class="flex w-full flex-col gap-12 lg:col-start-2 lg:row-start-1">
      <header class="flex flex-col gap-4">
        <p class="text-base leading-none font-medium uppercase min-[360px]:text-lg lg:text-xl">
          {{ 'about.eyebrow' | translate }}
        </p>

        <div class="flex w-fit max-w-full flex-col gap-1">
          <h2
            id="about-title"
            class="text-[2.5rem] leading-none font-bold min-[360px]:text-5xl lg:text-[4rem]"
          >
            {{ 'about.heading' | translate }}
          </h2>

          <img
            class="decorative-reveal h-5 w-full min-w-0"
            src="/assets/about/about-title-underline.svg"
            alt=""
            aria-hidden="true"
            draggable="false"
          />
        </div>
      </header>

      <div class="flex flex-col gap-6 text-base leading-normal min-[360px]:text-lg lg:text-xl">
        <p>
          {{ 'about.paragraphs.introduction' | translate }}
        </p>

        <p>
          {{ 'about.paragraphs.values' | translate }}
        </p>
      </div>

      <app-cta-link
        class="about__cta self-end"
        [label]="'about.cta' | translate"
        fragment="contact"
        surface="light"
      />
    </div>

    <ul
      class="availability-list w-full lg:col-start-1 lg:row-start-1"
      [attr.aria-label]="'about.availabilityAria' | translate"
    >
      @for (card of availabilityCards; track card.id) {
        <li class="availability-card relative" [attr.data-variant]="card.variant">
          <img
            class="availability-card__paper block h-auto w-full"
            [src]="card.paperSrc"
            alt=""
            aria-hidden="true"
            draggable="false"
          />

          <div
            class="availability-card__content absolute inset-0 flex items-center justify-center gap-3 text-foreground"
          >
            <img
              class="size-8 shrink-0 min-[360px]:size-10"
              [src]="card.iconSrc"
              alt=""
              aria-hidden="true"
              draggable="false"
            />
            <span class="text-base leading-[1.2] font-normal min-[360px]:text-xl lg:text-2xl">
              {{ card.labelKey | translate }}
            </span>
          </div>
        </li>
      }
    </ul>
  </div>
</section>
