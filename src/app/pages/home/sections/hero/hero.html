<section id="hero" class="hero" aria-labelledby="hero-title">
  <img
    class="hero__background"
    src="/assets/hero/hero-background.webp"
    alt=""
    aria-hidden="true"
    draggable="false"
    fetchpriority="high"
  />

  <div class="hero__stage">
    <div class="hero__composition">
      <div class="hero__top-row">
        <div class="hero__intro">
          <div class="hero__greeting">
            <img
              class="hero__wave"
              src="/assets/hero/waving-hand.svg"
              alt=""
              aria-hidden="true"
              draggable="false"
            />
            <p>Hello world</p>
          </div>

          <h1 id="hero-title" class="hero__title">
            <span>Frontend</span>
            <span>DEVELOPER</span>
          </h1>
        </div>

        <figure class="hero__polaroid">
          <div class="hero__portrait">
            <img
              class="hero__portrait-image hero__portrait-image--default"
              src="/assets/hero/portrait-default.webp"
              alt="Portrait of Kamyar Zamanfar"
              draggable="false"
            />
            <img
              class="hero__portrait-image hero__portrait-image--hover"
              src="/assets/hero/portrait-hover.webp"
              alt=""
              aria-hidden="true"
              draggable="false"
            />
          </div>
          <figcaption>Kamy :)</figcaption>
        </figure>
      </div>

      <a class="hero__cta" routerLink="/" fragment="contact">Get in Touch</a>
    </div>

    <nav class="hero__socials" aria-label="Social media links">
      <a
        href="https://www.linkedin.com/in/kamyarzamanfar/"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Open Kamyar Zamanfar's LinkedIn profile"
      >
        <img src="/assets/icons/social/linkedin.svg" alt="" aria-hidden="true" draggable="false" />
      </a>

      <a
        href="https://github.com/kamycoding"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Open Kamyar Zamanfar's GitHub profile"
      >
        <img src="/assets/icons/social/github.svg" alt="" aria-hidden="true" draggable="false" />
      </a>

      <a href="mailto:kamyar.zamanfar@gmail.com" aria-label="Send an email to Kamyar Zamanfar">
        <img src="/assets/icons/social/email.svg" alt="" aria-hidden="true" draggable="false" />
      </a>
    </nav>
  </div>
</section>
