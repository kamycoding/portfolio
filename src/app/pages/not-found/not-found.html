<main class="not-found" aria-labelledby="not-found-title">
  <div class="not-found__content">
    <p class="not-found__code">{{ 'notFound.code' | translate }}</p>

    <h1 id="not-found-title">{{ 'notFound.heading' | translate }}</h1>

    <p class="not-found__message">
      {{ 'notFound.description' | translate }}
    </p>

    <nav class="not-found__actions" [attr.aria-label]="'notFound.navigationAria' | translate">
      <a class="not-found__action not-found__action--primary" routerLink="/">
        {{ 'notFound.home' | translate }}
      </a>
      <a class="not-found__action not-found__action--secondary" routerLink="/" fragment="projects">
        {{ 'notFound.projects' | translate }}
      </a>
    </nav>
  </div>
</main>

<app-footer />
