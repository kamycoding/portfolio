<footer
  class="site-footer"
  [class.site-footer--light]="theme() === 'light'"
  [attr.aria-label]="'footer.aria' | translate"
>
  <div class="site-footer__inner">
    <div class="site-footer__brand">
      <a routerLink="/" [attr.aria-label]="'footer.homeAria' | translate">
        <img src="/logo.svg" alt="" draggable="false" />
      </a>
      <p>© Kamyar Zamanfar {{ currentYear }}</p>
    </div>

    <nav class="site-footer__legal-links" [attr.aria-label]="'footer.legalAria' | translate">
      <a class="site-footer__legal-link" routerLink="/legal-notice">
        <span>{{ 'footer.legalNotice' | translate }}</span>
        <img
          class="site-footer__legal-decoration"
          src="/assets/decorations/navigation/nav-hover-contact.svg"
          alt=""
          aria-hidden="true"
          draggable="false"
        />
      </a>

      <a class="site-footer__legal-link" routerLink="/privacy-policy">
        <span>{{ 'footer.privacyPolicy' | translate }}</span>
        <img
          class="site-footer__legal-decoration"
          src="/assets/decorations/navigation/nav-hover-contact.svg"
          alt=""
          aria-hidden="true"
          draggable="false"
        />
      </a>
    </nav>

    <nav class="site-footer__socials" [attr.aria-label]="'footer.linksAria' | translate">
      @for (item of socialLinks; track item.id) {
        <a
          class="site-footer__social-link"
          [href]="item.href"
          [attr.aria-label]="item.accessibleLabelKey | translate"
          [attr.target]="item.opensInNewTab ? '_blank' : null"
          [attr.rel]="item.opensInNewTab ? 'noopener noreferrer' : null"
        >
          <img
            class="site-footer__social-icon"
            [src]="item.iconSrc"
            alt=""
            aria-hidden="true"
            draggable="false"
          />
          <span>{{ item.labelKey | translate }}</span>
        </a>
      }
    </nav>
  </div>
</footer>
